[package]
name = "tower-mcp"
version = "0.12.0"
edition = "2024"
rust-version = "1.90"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/tower-mcp"
description = "Tower-native Model Context Protocol (MCP) implementation"
documentation = "https://docs.rs/tower-mcp"
homepage = "https://github.com/joshrotenberg/tower-mcp"
readme = "README.md"
keywords = ["mcp", "tower", "json-rpc", "ai", "llm"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
pin-project-lite = "0.2"
tower-mcp-types = { version = "0.12" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
async-trait = "0.1"
tracing = "0.1"
regex = "1"
base64 = "0.22.1"
thiserror = "2"
sha2 = { version = "0.11", optional = true }
getrandom = { version = "0.4", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"], optional = true }
urlencoding = { version = "2", optional = true }
tower-resilience = { version = "0.9.3", optional = true, default-features = false, features = ["bulkhead", "ratelimiter", "coalesce", "circuitbreaker"] }

[dev-dependencies]
async-trait = "0.1"
tokio-test = "0.4"
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-mcp-types = { version = "0.12", features = ["testing"] }
tower-resilience = { version = "0.9.3", default-features = false, features = ["coalesce", "ratelimiter", "circuitbreaker"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
jsonschema = "0.46"

[features]
default = []
# Enable all optional features
full = ["http", "websocket", "unix", "childproc", "oauth", "jwks", "testing", "http-client", "oauth-client", "proxy", "macros", "resilience", "stateless"]
# Transport features
http = ["dep:axum", "dep:hyper", "dep:http", "dep:http-body-util", "dep:tokio-stream", "dep:uuid"]
websocket = ["dep:axum", "dep:uuid"]
unix = ["http"]
childproc = []
# OAuth 2.1 resource server support
oauth = ["dep:jsonwebtoken", "http"]
# JWKS endpoint fetching for JWT validation (requires oauth)
jwks = ["oauth", "dep:reqwest"]
# Test utilities for MCP servers
testing = ["tower-mcp-types/testing"]
# HTTP client transport for connecting to remote MCP servers
http-client = ["dep:reqwest"]
# OAuth 2.0 client-side token acquisition (client credentials + authorization code)
oauth-client = ["http-client", "dep:sha2", "dep:getrandom", "dep:urlencoding"]
# Runtime tool (de)registration via DynamicToolRegistry
dynamic-tools = []
# MCP proxy for aggregating multiple backend servers
proxy = []
# Re-export tower-resilience circuit breaker, rate limiter, and bulkhead with observable handles
resilience = ["dep:tower-resilience"]
# Proc macros for tool/resource/prompt definitions
macros = ["dep:tower-mcp-macros"]
# SEP-1442 stateless MCP mode (experimental)
stateless = []

[dependencies.axum]
version = "0.8"
features = ["json", "ws"]
optional = true

[dependencies.hyper]
version = "1"
optional = true

[dependencies.http]
version = "1"
optional = true

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.tokio-stream]
version = "0.1"
optional = true
features = ["sync"]

[dependencies.uuid]
version = "1"
optional = true
features = ["v4"]

[dependencies.jsonwebtoken]
version = "10"
optional = true
default-features = false
features = ["aws_lc_rs", "use_pem"]

[dependencies.tower-mcp-macros]
version = "0.12"
optional = true
