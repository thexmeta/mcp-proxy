  - 'Proxy supports server/discover RPC and subscriptions/listen endpoint'
  - 'HTTP headers MCP-Protocol-Version, Mcp-Method, Mcp-Name parsed correctly'
  - 'Per-request _meta with protocol version, client identity, capabilities supported'
